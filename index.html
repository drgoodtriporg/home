<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mind Palace</title></title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,700;0,900;1,300&display=swap" rel="stylesheet">
    <link rel="preload" as="image" href="bg1.png">
    <link rel="preload" as="image" href="sky-mask.png">
    <style>
        * {
            box-sizing: border-box;
        }
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: 'Montserrat', sans-serif;
            background-color: #000;
            color: #ffffff;
            overflow: hidden;
        }

        /* BACKGROUND IMAGE
           Uses bg1.png from your repository.
           The plate is still. A masked copy of the sky drifts above it,
           and a soft curtain shimmers in the aurora. sky-mask.png is
           clear on the peaks, so the mountains never move.
        */
        .background-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('bg1.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 1;
            overflow: hidden;
        }

        .sky-window {
            position: absolute;
            inset: 0;
            z-index: 1;
            overflow: hidden;
            pointer-events: none;
            -webkit-mask-image: url('sky-mask.png');
            mask-image: url('sky-mask.png');
            -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;
            -webkit-mask-position: center;
            mask-position: center;
            -webkit-mask-size: cover;
            mask-size: cover;
        }

        .sky-drift,
        .sky-window::before {
            background-image: url('bg1.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .sky-drift {
            position: absolute;
            inset: 0;
            z-index: 1;
            transform-origin: 50% 18%;
            animation: aurora-drift 10s ease-in-out infinite;
            will-change: transform, filter;
        }

        /* A second exposure of the same sky, out of phase, so highlights breathe. */
        .sky-window::before {
            content: '';
            position: absolute;
            inset: 0;
            z-index: 2;
            transform-origin: 40% 10%;
            mix-blend-mode: soft-light;
            animation: aurora-sheen 6.5s ease-in-out infinite;
            will-change: transform, opacity;
        }

        /* Soft columns of light that travel across the aurora. */
        .aurora-band {
            position: absolute;
            top: -8%;
            left: 0;
            height: 70%;
            width: 36%;
            z-index: 3;
            border-radius: 50%;
            filter: blur(6px);
            mix-blend-mode: plus-lighter;
            pointer-events: none;
            will-change: transform, opacity;
        }

        .aurora-band-a {
            background: radial-gradient(ellipse at 50% 42%, rgba(140, 255, 235, 1), rgba(0, 230, 190, 0.62) 42%, transparent 70%);
            animation: aurora-band 7.5s ease-in-out infinite;
        }

        .aurora-band-b {
            background: radial-gradient(ellipse at 50% 48%, rgba(230, 150, 255, 1), rgba(140, 40, 230, 0.55) 44%, transparent 72%);
            animation: aurora-band 10s ease-in-out infinite reverse;
            animation-delay: -3.5s;
        }

        .aurora-band-c {
            background: radial-gradient(ellipse at 50% 40%, rgba(255, 214, 120, 1), rgba(255, 120, 40, 0.5) 44%, transparent 70%);
            animation: aurora-band 8.5s ease-in-out infinite;
            animation-delay: -5s;
        }

        @keyframes aurora-drift {
            0%, 100% {
                transform: scale(1) translate3d(0, 0, 0);
                filter: saturate(1) brightness(1);
            }
            34% {
                transform: scale(1.12) translate3d(5.2%, -2%, 0);
                filter: saturate(1.45) brightness(1.14);
            }
            67% {
                transform: scale(1.05) translate3d(-4.4%, 1.2%, 0);
                filter: saturate(1.22) brightness(1.04);
            }
        }

        @keyframes aurora-sheen {
            0%, 100% { transform: scale(1.03) translate3d(2.4%, 0.3%, 0); opacity: 0.22; }
            50%      { transform: scale(1.14) translate3d(-5%, 0.6%, 0); opacity: 0.82; }
        }

        @keyframes aurora-band {
            0%, 100% { transform: translate3d(-30%, 0, 0) scaleY(1.08); opacity: 0.55; }
            50%      { transform: translate3d(250%, -4%, 0) scaleY(1.16); opacity: 0.95; }
        }

        @media (prefers-reduced-motion: reduce) {
            .sky-window {
                display: none;
            }

            /* No dust and no reprise — the three lines stay stacked and still. */
            .nothing-dust,
            .ensemble {
                display: none;
            }
        }

        /* Dark overlay for text clarity */
        .veil {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.15);
            z-index: 4;
            pointer-events: none;
        }

        .container {
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 3;
        }

        h1 {
            text-transform: uppercase;
            text-align: center;
            line-height: 1.1;
            letter-spacing: 0.15em;
            text-shadow: 0 4px 20px rgba(0,0,0,0.6);
        }

        .line-1 {
            display: block;
            font-size: clamp(2rem, 5vw, 4rem);
            font-weight: 700;
            color: #f0f0f0;
        }

        .line-2 {
            display: block;
            font-size: clamp(3rem, 8vw, 6rem);
            font-weight: 900;
            color: #ffffff;
            margin: 10px 0;
        }

        .line-3 {
            display: block;
            font-size: clamp(2rem, 5vw, 4rem);
            font-weight: 300;
            color: rgba(255, 255, 255, 0.7);
            font-style: italic;
        }

        /* The solid word is what reduced-motion and screen readers get.
           Shards and the stacked reprise are motion-only. */
        .nothing-solid {
            display: contents;
        }

        .nothing-dust,
        .ensemble {
            display: none;
            user-select: none;
        }

        /* 18s score:
           ANYTHING and EVERYTHING crossfade, NOTHING holds, then
           loosens into fine dust and blows away on the aurora.
           All three words then rest in the original stack before
           ANYTHING returns. prefers-reduced-motion never enters. */
        @media (prefers-reduced-motion: no-preference) {
            h1 {
                display: grid;
                justify-items: center;
                align-items: center;
                --cycle: 18s;
            }

            h1 > .line-1,
            h1 > .line-2,
            h1 > .line-3,
            h1 > .ensemble {
                grid-area: 1 / 1;
            }

            h1 > .line-1,
            h1 > .line-2,
            h1 > .line-3 {
                margin: 0;
            }

            h1 > .line-1 { animation: solo-anything var(--cycle) linear infinite; }
            h1 > .line-2 { animation: solo-everything var(--cycle) linear infinite; }

            h1 > .line-3 {
                position: relative;
                z-index: 1;
                white-space: nowrap;
                animation: nothing-slot var(--cycle) linear infinite;
            }

            .nothing-solid {
                display: block;
                position: relative;
                z-index: 2;
                animation: nothing-solid var(--cycle) linear infinite;
            }

            .nothing-dust {
                display: block;
                position: absolute;
                z-index: 1;
                width: 0;
                height: 0;
                pointer-events: none;
            }

            .ensemble {
                display: flex;
                flex-direction: column;
                align-items: center;
                z-index: 2;
                pointer-events: none;
                animation: ensemble-beat var(--cycle) linear infinite;
            }
        }

        @keyframes solo-anything {
            0%, 7.22% {
                opacity: 1;
                transform: translateY(0);
                animation-timing-function: ease-in;
            }
            11.11% {
                opacity: 0;
                transform: translateY(-0.22em);
                animation-timing-function: linear;
            }
            90.56% {
                opacity: 0;
                transform: translateY(0.28em);
                animation-timing-function: cubic-bezier(0.22, 0.61, 0.36, 1);
            }
            94.17%, 100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes solo-everything {
            0%, 9.17% {
                opacity: 0;
                transform: translateY(0.28em);
                animation-timing-function: cubic-bezier(0.22, 0.61, 0.36, 1);
            }
            12.5% {
                opacity: 1;
                transform: translateY(0);
                animation-timing-function: linear;
            }
            25% {
                opacity: 1;
                transform: translateY(0);
                animation-timing-function: ease-in;
            }
            28.89% {
                opacity: 0;
                transform: translateY(-0.22em);
            }
            29.5%, 100% {
                opacity: 0;
                transform: translateY(0.28em);
            }
        }

        @keyframes nothing-slot {
            0%, 26.39% { transform: translateY(0.28em); animation-timing-function: cubic-bezier(0.22, 0.61, 0.36, 1); }
            29.72%, 100% { transform: translateY(0); }
        }

        @keyframes nothing-solid {
            0%, 26.39% { opacity: 0; filter: brightness(1); }
            29.72% { opacity: 1; filter: brightness(1); animation-timing-function: linear; }
            42.22% { opacity: 1; filter: brightness(1); animation-timing-function: ease-out; }
            43.6% { opacity: 1; filter: brightness(1.12); }
            44.72%, 100% { opacity: 0; filter: brightness(1); }
        }

        @keyframes ensemble-beat {
            0%, 63.61% {
                opacity: 0;
                transform: translateY(0.16em);
                animation-timing-function: cubic-bezier(0.22, 0.61, 0.36, 1);
            }
            66.94% {
                opacity: 1;
                transform: translateY(0);
                animation-timing-function: linear;
            }
            85.56% {
                opacity: 1;
                transform: translateY(0);
                animation-timing-function: ease-in;
            }
            89.17%, 100% {
                opacity: 0;
                transform: translateY(-0.1em);
            }
        }

    </style>
</head>
<body>
    <div class="background-overlay" aria-hidden="true">
        <div class="sky-window">
            <div class="sky-drift"></div>
            <div class="aurora-band aurora-band-a"></div>
            <div class="aurora-band aurora-band-b"></div>
            <div class="aurora-band aurora-band-c"></div>
        </div>
        <div class="veil"></div>
    </div>
    
    <div class="container">
        <main>
            <h1>
                <span class="line-1">anything</span>
                <span class="line-2">everything</span>
                <span class="line-3"><span class="nothing-solid">nothing</span><canvas class="nothing-dust" width="0" height="0" aria-hidden="true"></canvas></span>
                <span class="ensemble" aria-hidden="true">
                    <span class="line-1">anything</span>
                    <span class="line-2">everything</span>
                    <span class="line-3">nothing</span>
                </span>
            </h1>
        </main>
    </div>
    <script>
        (function () {
            var reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
            if (reduce.matches) return;

            var solid = document.querySelector('.nothing-solid');
            var canvas = document.querySelector('.nothing-dust');
            if (!solid || !canvas || !canvas.getContext) return;
            var ctx = canvas.getContext('2d', { alpha: true });
            var particles = [];
            var builtKey = '';
            var textPoint = { x: 0, y: 0 };
            var sprite = document.createElement('canvas');
            sprite.width = sprite.height = 16;
            var sctx = sprite.getContext('2d');
            var grad = sctx.createRadialGradient(8, 8, 0, 8, 8, 8);
            grad.addColorStop(0, 'rgba(255,255,255,1)');
            grad.addColorStop(0.4, 'rgba(255,255,255,0.5)');
            grad.addColorStop(1, 'rgba(255,255,255,0)');
            sctx.fillStyle = grad;
            sctx.fillRect(0, 0, 16, 16);

            function fract(v) { return v - Math.floor(v); }

            function smooth(u) {
                if (u <= 0) return 0;
                if (u >= 1) return 1;
                return u * u * (3 - 2 * u);
            }

            function rebuild() {
                var cs = getComputedStyle(solid);
                var host = solid.parentElement.getBoundingClientRect();
                if (host.width < 2 || host.height < 2) return;
                var dpr = Math.min(window.devicePixelRatio || 1, 2);
                var padL = host.width * 0.55;
                var padR = host.width * 1.7;
                var padT = host.height * 3.4;
                var padB = host.height * 1.1;
                var cssW = host.width + padL + padR;
                var cssH = host.height + padT + padB;
                canvas.style.width = cssW + 'px';
                canvas.style.height = cssH + 'px';
                canvas.width = Math.max(1, Math.ceil(cssW * dpr));
                canvas.height = Math.max(1, Math.ceil(cssH * dpr));
                textPoint.x = padL + host.width / 2;
                textPoint.y = padT + host.height / 2;
                canvas.style.left = (-padL) + 'px';
                canvas.style.top = (-padT) + 'px';

                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                ctx.clearRect(0, 0, cssW, cssH);
                ctx.font = cs.font;
                try { ctx.letterSpacing = cs.letterSpacing; } catch (e) {}
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = '#fff';
                ctx.fillText('NOTHING', textPoint.x, textPoint.y);

                var img = ctx.getImageData(0, 0, canvas.width, canvas.height);
                var data = img.data;
                var w = canvas.width;
                var stride = Math.max(1, Math.round(dpr * 1.55));
                var next = [];
                for (var y = 0; y < canvas.height; y += stride) {
                    for (var x = 0; x < w; x += stride) {
                        if (data[(y * w + x) * 4 + 3] < 40) continue;
                        var i = next.length + 1;
                        next.push({
                            x: x / dpr,
                            y: y / dpr,
                            n1: fract(Math.sin(i * 127.1) * 43758.5),
                            n2: fract(Math.sin(i * 269.5) * 24634.6),
                            n3: fract(Math.sin(i * 419.2) * 12578.3)
                        });
                    }
                }
                var minX = Infinity, maxX = -Infinity;
                for (var p = 0; p < next.length; p++) {
                    if (next[p].x < minX) minX = next[p].x;
                    if (next[p].x > maxX) maxX = next[p].x;
                }
                var span = Math.max(1, maxX - minX);
                for (var q = 0; q < next.length; q++) next[q].xn = (next[q].x - minX) / span;
                particles = next;
                builtKey = cs.font + '|' + cs.letterSpacing + '|' + Math.round(host.width) + 'x' + Math.round(host.height) + '@' + dpr;
                ctx.setTransform(1, 0, 0, 1, 0, 0);
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }

            function frame() {
                requestAnimationFrame(frame);
                var anims = solid.getAnimations();
                if (!anims.length || anims[0].currentTime == null) return;
                var anim = anims[0];
                var cs = getComputedStyle(solid);
                var host = solid.parentElement.getBoundingClientRect();
                var dpr = Math.min(window.devicePixelRatio || 1, 2);
                var key = cs.font + '|' + cs.letterSpacing + '|' + Math.round(host.width) + 'x' + Math.round(host.height) + '@' + dpr;
                if (key !== builtKey) rebuild();
                if (!particles.length) return;

                var dur = anim.effect.getTiming().duration;
                var t = (anim.currentTime % dur) / 1000;
                ctx.setTransform(1, 0, 0, 1, 0, 0);
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                if (t < 7.55 || t > 11.25) return;

                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                var solidOp = parseFloat(cs.opacity);
                if (isNaN(solidOp)) solidOp = 0;
                var reveal = 1 - Math.min(1, Math.max(0, solidOp));
                var windAt = 8.12;
                for (var i = 0; i < particles.length; i++) {
                    var p = particles[i];
                    var delay = p.xn * 0.22 + p.n1 * 0.32;
                    var u = (t - windAt - delay) / 2.35;
                    var k = smooth(u);
                    var life = u <= 0.62 ? 1 : Math.pow(1 - Math.min((u - 0.62) / 0.38, 1), 1.35);
                    var alpha = reveal * life;
                    if (alpha < 0.025) continue;
                    var dx = (36 + p.n2 * 160 + (p.n1 - 0.5) * 90) * k;
                    var dy = (-22 - p.n3 * 130 + (p.n2 - 0.5) * 84) * k;
                    if (p.n1 > 0.94) dy += (28 + p.n3 * 16) * k;
                    dx += Math.sin(k * 2.8 + p.n3 * 11) * 8 * k;
                    var size = (1.25 + p.n3 * 0.95) * (1 - k * 0.15);
                    ctx.globalAlpha = alpha * (0.72 + p.n2 * 0.28);
                    ctx.drawImage(sprite, p.x + dx - size, p.y + dy - size, size * 2, size * 2);
                }
                ctx.globalAlpha = 1;
            }

            function start() {
                rebuild();
                requestAnimationFrame(frame);
            }
            if (document.fonts && document.fonts.ready) document.fonts.ready.then(start);
            else start();
            window.addEventListener('resize', function () { builtKey = ''; });
        }());
    </script>

</body>
</html>
