<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mind Palace</title></title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,700;0,900;1,300&display=swap" rel="stylesheet">
    <link rel="preload" as="image" href="bg1.png">
    <link rel="preload" as="image" href="sky-mask.png">
    <style>
        * {
            box-sizing: border-box;
        }
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: 'Montserrat', sans-serif;
            background-color: #000;
            color: #ffffff;
            overflow: hidden;
        }

        /* BACKGROUND IMAGE
           Uses bg1.png from your repository.
           The plate is still. A masked copy of the sky drifts above it,
           and a soft curtain shimmers in the aurora. sky-mask.png is
           clear on the peaks, so the mountains never move.
        */
        .background-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('bg1.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 1;
            overflow: hidden;
        }

        .sky-window {
            position: absolute;
            inset: 0;
            z-index: 1;
            overflow: hidden;
            pointer-events: none;
            -webkit-mask-image: url('sky-mask.png');
            mask-image: url('sky-mask.png');
            -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;
            -webkit-mask-position: center;
            mask-position: center;
            -webkit-mask-size: cover;
            mask-size: cover;
        }

        .sky-drift,
        .sky-window::before {
            background-image: url('bg1.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .sky-drift {
            position: absolute;
            inset: 0;
            z-index: 1;
            transform-origin: 50% 18%;
            animation: aurora-drift 10s ease-in-out infinite;
            will-change: transform, filter;
        }

        /* A second exposure of the same sky, out of phase, so highlights breathe. */
        .sky-window::before {
            content: '';
            position: absolute;
            inset: 0;
            z-index: 2;
            transform-origin: 40% 10%;
            mix-blend-mode: soft-light;
            animation: aurora-sheen 6.5s ease-in-out infinite;
            will-change: transform, opacity;
        }

        /* Soft columns of light that travel across the aurora. */
        .aurora-band {
            position: absolute;
            top: -8%;
            left: 0;
            height: 70%;
            width: 36%;
            z-index: 3;
            border-radius: 50%;
            filter: blur(6px);
            mix-blend-mode: plus-lighter;
            pointer-events: none;
            will-change: transform, opacity;
        }

        .aurora-band-a {
            background: radial-gradient(ellipse at 50% 42%, rgba(140, 255, 235, 1), rgba(0, 230, 190, 0.62) 42%, transparent 70%);
            animation: aurora-band 7.5s ease-in-out infinite;
        }

        .aurora-band-b {
            background: radial-gradient(ellipse at 50% 48%, rgba(230, 150, 255, 1), rgba(140, 40, 230, 0.55) 44%, transparent 72%);
            animation: aurora-band 10s ease-in-out infinite reverse;
            animation-delay: -3.5s;
        }

        .aurora-band-c {
            background: radial-gradient(ellipse at 50% 40%, rgba(255, 214, 120, 1), rgba(255, 120, 40, 0.5) 44%, transparent 70%);
            animation: aurora-band 8.5s ease-in-out infinite;
            animation-delay: -5s;
        }

        @keyframes aurora-drift {
            0%, 100% {
                transform: scale(1) translate3d(0, 0, 0);
                filter: saturate(1) brightness(1);
            }
            34% {
                transform: scale(1.12) translate3d(5.2%, -2%, 0);
                filter: saturate(1.45) brightness(1.14);
            }
            67% {
                transform: scale(1.05) translate3d(-4.4%, 1.2%, 0);
                filter: saturate(1.22) brightness(1.04);
            }
        }

        @keyframes aurora-sheen {
            0%, 100% { transform: scale(1.03) translate3d(2.4%, 0.3%, 0); opacity: 0.22; }
            50%      { transform: scale(1.14) translate3d(-5%, 0.6%, 0); opacity: 0.82; }
        }

        @keyframes aurora-band {
            0%, 100% { transform: translate3d(-30%, 0, 0) scaleY(1.08); opacity: 0.55; }
            50%      { transform: translate3d(250%, -4%, 0) scaleY(1.16); opacity: 0.95; }
        }

        @media (prefers-reduced-motion: reduce) {
            .sky-window {
                display: none;
            }

            /* No shatter and no reprise — the three lines stay stacked and still. */
            .nothing-shards,
            .ensemble {
                display: none;
            }
        }

        /* Dark overlay for text clarity */
        .veil {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.15);
            z-index: 4;
            pointer-events: none;
        }

        .container {
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 3;
        }

        h1 {
            text-transform: uppercase;
            text-align: center;
            line-height: 1.1;
            letter-spacing: 0.15em;
            text-shadow: 0 4px 20px rgba(0,0,0,0.6);
        }

        .line-1 {
            display: block;
            font-size: clamp(2rem, 5vw, 4rem);
            font-weight: 700;
            color: #f0f0f0;
        }

        .line-2 {
            display: block;
            font-size: clamp(3rem, 8vw, 6rem);
            font-weight: 900;
            color: #ffffff;
            margin: 10px 0;
        }

        .line-3 {
            display: block;
            font-size: clamp(2rem, 5vw, 4rem);
            font-weight: 300;
            color: rgba(255, 255, 255, 0.7);
            font-style: italic;
        }

        /* The solid word is what reduced-motion and screen readers get.
           Shards and the stacked reprise are motion-only. */
        .nothing-solid {
            display: contents;
        }

        .nothing-shards,
        .ensemble {
            display: none;
            user-select: none;
        }

        /* 14s score:
           ANYTHING and EVERYTHING crossfade, NOTHING holds, then
           breaks into shards. After the shards dissolve, all three
           words show together in the original stack, then ANYTHING
           returns. prefers-reduced-motion never enters this block. */
        @media (prefers-reduced-motion: no-preference) {
            h1 {
                display: grid;
                justify-items: center;
                align-items: center;
                --cycle: 14s;
            }

            h1 > .line-1,
            h1 > .line-2,
            h1 > .line-3,
            h1 > .ensemble {
                grid-area: 1 / 1;
            }

            h1 > .line-1,
            h1 > .line-2,
            h1 > .line-3 {
                margin: 0;
            }

            h1 > .line-1 { animation: solo-anything var(--cycle) linear infinite; }
            h1 > .line-2 { animation: solo-everything var(--cycle) linear infinite; }

            h1 > .line-3 {
                position: relative;
                z-index: 1;
                white-space: nowrap;
                animation: nothing-slot var(--cycle) linear infinite;
            }

            .nothing-solid {
                display: block;
                position: relative;
                z-index: 2;
                animation: nothing-solid var(--cycle) linear infinite;
            }

            .nothing-shards {
                display: block;
                position: absolute;
                inset: 0;
                z-index: 1;
                pointer-events: none;
            }

            .nothing-shards::after {
                content: "";
                position: absolute;
                left: 50%;
                top: 54%;
                z-index: 0;
                width: 130%;
                height: 2.4em;
                transform: translate(-50%, -50%);
                background: radial-gradient(ellipse at center,
                    rgba(186, 255, 242, 0.34),
                    rgba(176, 120, 255, 0.12) 46%,
                    transparent 72%);
                mix-blend-mode: screen;
                opacity: 0;
                animation: shard-glow var(--cycle) linear infinite;
                pointer-events: none;
            }

            .shard {
                position: absolute;
                inset: 0;
                z-index: 1;
                display: block;
                text-align: center;
                white-space: nowrap;
                clip-path: polygon(var(--clip));
                transform-origin: var(--origin);
                animation: shard-fly var(--cycle) linear infinite;
            }

            /* Irregular slices. Edge pieces extend past the box so the italic
               overhang and the g descender stay intact while the word is whole. */
            .s1 { --clip: -32% -50%, 17.2% -50%, 13.4% 150%, -32% 150%; --origin: 8% 50%; --dx: -0.78em; --dy: -0.36em; --r: -6.5deg; }
            .s2 { --clip: 14.6% -50%, 33.2% -6%, 29.4% 150%, 11.2% 122%; --origin: 23% 58%; --dx: -0.38em; --dy: -0.66em; --r: -3deg; }
            .s3 { --clip: 30.2% -50%, 58.4% -50%, 54.2% 48%, 26.8% 40%; --origin: 44% 20%; --dx: 0.06em; --dy: -0.74em; --r: 4.5deg; }
            .s4 { --clip: 24.8% 36%, 56.2% 44%, 60.4% 150%, 27.6% 150%; --origin: 42% 84%; --dx: -0.14em; --dy: 0.46em; --r: -3.5deg; }
            .s5 { --clip: 52.2% -50%, 74.2% -16%, 78.2% 150%, 54.8% 150%; --origin: 66% 48%; --dx: 0.42em; --dy: -0.32em; --r: 5.5deg; }
            .s6 { --clip: 71.2% -50%, 90.4% 8%, 94.2% 150%, 73.6% 132%; --origin: 83% 54%; --dx: 0.72em; --dy: 0.24em; --r: -4.5deg; }
            .s7 { --clip: 86.2% -50%, 136% -50%, 136% 150%, 87.8% 128%; --origin: 102% 46%; --dx: 1.02em; --dy: -0.28em; --r: 4deg; }

            .ensemble {
                display: flex;
                flex-direction: column;
                align-items: center;
                z-index: 2;
                pointer-events: none;
                animation: ensemble-beat var(--cycle) linear infinite;
            }
        }

        @keyframes solo-anything {
            0%, 13% {
                opacity: 1;
                transform: translateY(0);
                animation-timing-function: ease-in;
            }
            18% {
                opacity: 0;
                transform: translateY(-0.22em);
                animation-timing-function: linear;
            }
            91.5% {
                opacity: 0;
                transform: translateY(0.28em);
                animation-timing-function: cubic-bezier(0.22, 0.61, 0.36, 1);
            }
            96.5%, 100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes solo-everything {
            0%, 15.5% {
                opacity: 0;
                transform: translateY(0.28em);
                animation-timing-function: cubic-bezier(0.22, 0.61, 0.36, 1);
            }
            20.5% {
                opacity: 1;
                transform: translateY(0);
                animation-timing-function: linear;
            }
            36.5% {
                opacity: 1;
                transform: translateY(0);
                animation-timing-function: ease-in;
            }
            41.5% {
                opacity: 0;
                transform: translateY(-0.22em);
            }
            42%, 100% {
                opacity: 0;
                transform: translateY(0.28em);
            }
        }

        @keyframes nothing-slot {
            0%, 39% { transform: translateY(0.28em); animation-timing-function: cubic-bezier(0.22, 0.61, 0.36, 1); }
            44%, 100% { transform: translateY(0); }
        }

        @keyframes nothing-solid {
            0%, 39% { opacity: 0; filter: brightness(1); }
            44% { opacity: 1; filter: brightness(1); animation-timing-function: linear; }
            59.6% { opacity: 1; filter: brightness(1); animation-timing-function: ease-out; }
            60.7% { opacity: 1; filter: brightness(1.42); }
            61.2%, 100% { opacity: 0; filter: brightness(1); }
        }

        @keyframes shard-fly {
            0%, 59.2% {
                opacity: 0;
                transform: none;
                filter: none;
            }
            60% {
                opacity: 1;
                transform: none;
                filter: none;
                animation-timing-function: linear;
            }
            61.2% {
                opacity: 1;
                transform: none;
                filter: none;
                animation-timing-function: cubic-bezier(0.16, 0.72, 0.24, 1);
            }
            66.4% {
                opacity: 1;
                filter: drop-shadow(0 0 7px rgba(150, 255, 236, 0.42));
                transform: translate3d(calc(var(--dx) * 0.62), calc(var(--dy) * 0.62), 0) rotate(calc(var(--r) * 0.62));
                animation-timing-function: ease-in;
            }
            70.5% {
                opacity: 0;
                filter: blur(1.15px) drop-shadow(0 0 12px rgba(188, 140, 255, 0.2));
                transform: translate3d(var(--dx), var(--dy), 0) rotate(var(--r)) scale(0.96);
            }
            71.6%, 100% {
                opacity: 0;
                transform: none;
                filter: none;
            }
        }

        @keyframes shard-glow {
            0%, 60.4% { opacity: 0; }
            62.4% { opacity: 0.95; }
            70.5%, 100% { opacity: 0; }
        }

        @keyframes ensemble-beat {
            0%, 72% {
                opacity: 0;
                transform: translateY(0.18em);
                animation-timing-function: cubic-bezier(0.22, 0.61, 0.36, 1);
            }
            76% {
                opacity: 1;
                transform: translateY(0);
                animation-timing-function: linear;
            }
            87.5% {
                opacity: 1;
                transform: translateY(0);
                animation-timing-function: ease-in;
            }
            91.5%, 100% {
                opacity: 0;
                transform: translateY(-0.12em);
            }
        }
    </style>
</head>
<body>
    <div class="background-overlay" aria-hidden="true">
        <div class="sky-window">
            <div class="sky-drift"></div>
            <div class="aurora-band aurora-band-a"></div>
            <div class="aurora-band aurora-band-b"></div>
            <div class="aurora-band aurora-band-c"></div>
        </div>
        <div class="veil"></div>
    </div>
    
    <div class="container">
        <main>
            <h1>
                <span class="line-1">anything</span>
                <span class="line-2">everything</span>
                <span class="line-3"><span class="nothing-solid">nothing</span><span class="nothing-shards" aria-hidden="true"><span class="shard s1">nothing</span><span class="shard s2">nothing</span><span class="shard s3">nothing</span><span class="shard s4">nothing</span><span class="shard s5">nothing</span><span class="shard s6">nothing</span><span class="shard s7">nothing</span></span></span>
                <span class="ensemble" aria-hidden="true">
                    <span class="line-1">anything</span>
                    <span class="line-2">everything</span>
                    <span class="line-3">nothing</span>
                </span>
            </h1>
        </main>
    </div>
</body>
</html>
